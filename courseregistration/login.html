    <button style="width:100%">Login</button>
  </form>
  {{ERROR}}
  <p class="mu">Demo accounts (password 1234):<br>
    Student: S101 (Sem 3), S102 (Sem 5)<br>
    Advisor: A01 · Accountant: AC01 · HOD: H01 · Admin: AD01</p>
  <form method="get" action="/confirm-reset"><button class="g s">Reset demo data</button></form>
</div>
